<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>CSS Flag Project</title>
  <style>
    /* Write your CSS Code here */
    .flag{
      background-color: #ce1126;
      height: 600px;
      width: 900px;
      position: relative;
      top:-72px;
      left:0px;
      right:0px;
      bottom:0px;
  }
  p{
    font-size: 5rem;
    color:white;
    text-align: center;
  }
  .flag>div{
    position:absolute;
    background-color: #002868;
    width:900px;
    top:150px;
    bottom: 150px;
  }
  .flag>div div{
    position:absolute;
    background-color: white;
    height:200px;
    width:200px;
    border-radius: 50%;
    top:50px;
    left:350px;
  }
  .flag>div div>p{
    position:absolute;
    top:-80px;
    color: black;
  }
  </style>
</head>

<!-- 
  IMPORTANT! Do not change any HTML
Don't add any classes/ids/elements 
Use what you know about combining selectors 
and CSS specificity instead.
Hint 1: The flag is 900px by 600px and the circle is 200px by 200px.
Hint 2: You can use CSS inspection to get the colors from
https://appbrewery.github.io/flag-of-laos/
-->

<body>
  <div class="flag">
    <p>The Flag</p>
    <div>
      <div>
        <p>of Laos</p>
      </div>
    </div>
  </div>
</body>

</html>
